[project]
name = "payment-service"
version = "0.1.0"
description = "Receives payment-processor transaction webhooks and processes them reliably in the background."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "pydantic-settings==2.11.0",
  "asyncpg==0.30.0",
  "vercel-queue==0.10.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.1",
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "asyncpg-stubs==0.30.2",
  "uvicorn==0.54.0",
]

[tool.vercel]
entrypoint = "backend.main:app"

[[tool.vercel.subscribers]]
entrypoint = "backend.worker.subscriber"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs real Supabase / queue devserver"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend"]
